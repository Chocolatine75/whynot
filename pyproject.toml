[project]
name = "whynot"
version = "0.1.0"
description = "AI ad agency for small businesses on Meta"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openai>=1.60",
    "pillow>=13.0.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
whynot = "whynot.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.170.13",
    "mypy>=2.4.0",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whynot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # unicode ×, →, · in strings and comments are intended

[tool.ruff.lint.per-file-ignores]
"src/whynot/agents/*.py" = ["E501"]  # prompts are prose; wrapping them changes what the model reads

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.coverage.run]
source = ["whynot"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
