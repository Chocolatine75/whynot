[project]
name = "whynot"
version = "0.1.0"
description = "AI ad agency for small businesses on Meta"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openai>=1.60",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whynot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
